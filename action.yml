name: 'node9 Agent Security Check'
description: 'Scan a repo for agent-security risks (injectable CI workflows, unsafe agent configs, MCP) and comment on the PR.'
author: 'node9'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  fail-on:
    description: 'Fail the check when the worst finding is at least this severity: never | medium | high | critical'
    required: false
    default: 'never'
  comment:
    description: 'Post a sticky comment on the PR with the findings'
    required: false
    default: 'true'
  node9-version:
    description: 'node9-ai version to run (pin for reproducibility; "latest" for newest)'
    required: false
    default: 'latest'
  github-token:
    description: 'Token for posting the comment + check-run (defaults to the job token)'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    # Self-contained: check out the repo so we have the config to scan. Idempotent
    # if the caller already checked out.
    - name: Check out repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: '20'

    - name: Run node9 agent-security scan
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        # Static, config-only scan of the checked-out workspace. Never fails this
        # step on a finding (the gate is applied by comment.js per fail-on).
        npx -y "node9-ai@${{ inputs.node9-version }}" scan-repo "$GITHUB_WORKSPACE" --json \
          > "${RUNNER_TEMP}/node9-result.json" || true
        echo "result=${RUNNER_TEMP}/node9-result.json" >> "$GITHUB_OUTPUT"

    - name: Comment + gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NODE9_RESULT: ${{ steps.scan.outputs.result }}
        NODE9_FAIL_ON: ${{ inputs.fail-on }}
        NODE9_COMMENT: ${{ inputs.comment }}
      run: node "${GITHUB_ACTION_PATH}/comment.js"

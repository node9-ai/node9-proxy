# Read-only gh subcommands only.
name: Duplicate check
on:
  issues:
    types: [opened]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-base-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash(gh issue view:*),Bash(gh search issues:*)"
          prompt: |
            Find duplicates of issue ${{ github.event.issue.number }}: ${{ github.event.issue.title }}

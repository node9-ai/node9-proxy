# Any new issue drives Gemini, but its only tool reads files: it can only write text.
name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |-
            {
              "coreTools": [
                "read_file"
              ]
            }
          prompt: |-
            Label issue ${ISSUE_NUMBER}. Read it with the tools you have.

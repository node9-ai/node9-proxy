# Open to everyone, but a read-only sandbox and no token: the agent only writes text.
name: Issue bot
on:
  issues:
    types: [opened]
jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt-file: .github/prompts/respond.md
          allow-users: "*"

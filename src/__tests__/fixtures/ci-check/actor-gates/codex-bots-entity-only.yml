# allow-bots on entity events only: the actor there is always a person, so the check holds.
name: Worker
on:
  issues:
    types: [opened]
jobs:
  work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: danger-full-access
          allow-bots: true
          prompt: "Do: ${{ github.event.issue.title }} ${{ github.event.issue.body }}"

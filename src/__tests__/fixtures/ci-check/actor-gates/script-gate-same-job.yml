# A github-script step asks for the commenter's permission and raises a refusal flag; the
# agent step runs only while the flag is down.
name: Helper
on:
  issue_comment:
    types: [created]
jobs:
  answer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const who = context.payload.comment.user.login;
            const res = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: who,
            });
            core.setOutput("denied", ["admin", "write"].includes(res.data.permission) ? "false" : "true");
      - uses: actions/checkout@v4
      - name: Agent
        if: steps.guard.outputs.denied != 'true'
        uses: example/helper-claude@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Answer: ${{ github.event.comment.body }}"
          claude_args: '--allowedTools "Bash"'

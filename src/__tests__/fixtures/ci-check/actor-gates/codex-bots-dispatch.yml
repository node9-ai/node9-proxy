# Started by a dispatch (another workflow can send one with the job token), and allow-bots
# lets that bot actor through: the action's write check does not hold a stranger's chain.
name: Worker
on:
  workflow_dispatch:
    inputs:
      text:
        required: true
  issues:
    types: [opened]
jobs:
  work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: danger-full-access
          allow-bots: true
          prompt: "Do: ${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ inputs.text }}"

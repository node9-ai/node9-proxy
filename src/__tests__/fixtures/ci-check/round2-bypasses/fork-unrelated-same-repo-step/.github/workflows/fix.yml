on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    if: github.event.issue.pull_request && github.event.comment.author_association == 'MEMBER' && startsWith(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Note internal branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: echo "internal branch"
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Fix the failing tests on this branch and push."
          claude_args: "--allowedTools Bash"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

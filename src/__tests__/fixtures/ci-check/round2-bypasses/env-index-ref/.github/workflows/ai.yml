on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      REQUEST: ${{ github.event.comment.body }}
    steps:
      - uses: anthropics/claude-code-base-action@v1
        with:
          prompt: "Handle this request: ${{ env['REQUEST'] }}"
          allowed_tools: "Bash"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

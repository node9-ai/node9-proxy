on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Handle this request: ${{ github.event.comment.body }}"
          claude_args: "--allowedTools Bash"
          allowed_non_write_users: ${{ github.event.sender.login }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

# A reusable agent template that reads a prompt built from the PR payload, and can push.
name: Agent template
on:
  workflow_call:
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Build prompt
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request || {};
            require("fs").writeFileSync("/tmp/prompt.txt", `${pr.title}\n${pr.body}`);
      - uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: /tmp/prompt.txt
          allowed_tools: Bash

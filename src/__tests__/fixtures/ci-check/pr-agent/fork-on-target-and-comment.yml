# A fork of pr-agent on pull_request_target and on comments, no actor check.
name: PR review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: example-org/pr-agent@v1
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

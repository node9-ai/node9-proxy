name: Nightly benchmarks
on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make bench > bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

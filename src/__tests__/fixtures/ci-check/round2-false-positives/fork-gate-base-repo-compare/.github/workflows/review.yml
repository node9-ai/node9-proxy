name: claude review (internal branches)
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.label.name == 'claude-review' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Review this pull request.

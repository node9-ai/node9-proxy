# Reads the issue, but only for a trusted author.
name: Gated triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: anthropics/claude-code-base-action@beta
        with:
          prompt: "Triage issue ${{ github.event.issue.number }}"
          allowed_tools: "mcp__github__get_issue,mcp__github__update_issue"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

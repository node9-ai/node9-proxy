# Shape of a triage-and-debug workflow: a github-script step writes the issue
# body into a prompt file, and the agent runs with unrestricted Bash.
name: Issue Triage & Debug
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Build prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            fs.writeFileSync('/tmp/prompt.txt', 'Reproduce this bug:\n' + body);
      - uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: /tmp/prompt.txt
          allowed_tools: "View,GlobTool,GrepTool,Bash"

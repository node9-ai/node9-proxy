# Compact JSON is one line: written under a fixed name it cannot add a variable.
name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BODY: ${{ github.event.issue.body }}
        run: |
          claude -p "Summarise: $BODY" > out.txt
      - run: |
          jq -Rs '{summary: .}' out.txt > out.json
          echo "SUMMARY=$(jq -c . out.json)" >> "$GITHUB_ENV"
      - run: ./scripts/next.sh

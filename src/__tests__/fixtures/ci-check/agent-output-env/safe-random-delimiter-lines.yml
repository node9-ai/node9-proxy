# The same, written line by line.
name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BODY: ${{ github.event.issue.body }}
        run: |
          claude -p "Summarise: $BODY" > out.txt
      - run: |
          EOF_MARK=$(uuidgen)
          echo "SUMMARY<<$EOF_MARK" >> $GITHUB_ENV
          cat out.txt >> $GITHUB_ENV
          echo "$EOF_MARK" >> $GITHUB_ENV
      - run: ./scripts/next.sh

# Newlines removed and a fixed name: the answer cannot add a variable.
name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BODY: ${{ github.event.issue.body }}
        run: |
          claude -p "Summarise: $BODY" > out.txt
      - run: echo "SUMMARY=$(cat out.txt | tr -d '\n')" >> "$GITHUB_ENV"
      - run: ./scripts/next.sh

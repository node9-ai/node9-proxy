# The PR's diff comes from the compare API between the event's base and head; the agent reviews
# it through Bedrock, and a raw jq projection of its answer goes into GITHUB_ENV.
name: Diff review
on:
  pull_request_target:
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
    steps:
      - run: |
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
      - run: |
          curl -s -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" > diff.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.REVIEW_ROLE }}
          aws-region: us-east-1
      - run: |
          cat diff.txt | claude -p "Report risky changes as JSON" > report.json
          REPORT=$(cat report.json | jq -c '.')
          SUMMARY=$(echo "$REPORT" | jq -r '.summary')
          echo "review_summary=$SUMMARY" >> $GITHUB_ENV
      - run: ./scripts/post-summary.sh

# The `||` sits inside a string literal: one branch, gated.
name: Claude
on:
  issue_comment:
    types: [created]
jobs:
  claude:
    if: ${{ contains(github.event.comment.body, '@claude || help') && github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "Answer ${{ github.event.comment.body }}"

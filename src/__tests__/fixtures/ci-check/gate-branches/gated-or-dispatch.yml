# The only ungated branch is a manual dispatch (write access): still gated.
name: Claude
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
jobs:
  claude:
    if: (github.event_name == 'issue_comment' && github.event.comment.author_association == 'MEMBER') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "Answer ${{ github.event.comment.body }}"

# A reusable agent template that reads a prompt built from the PR payload.
name: Analysis
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Build prompt
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request || {};
            require("fs").writeFileSync("/tmp/prompt.txt", `${pr.title}\n${pr.body}`);
      - uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: /tmp/prompt.txt
          allowed_tools: View,GlobTool,GrepTool,Write

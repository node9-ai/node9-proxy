# One job, two agent paths: a same-repo step and a fork step. Only the same-repo step carries
# a same-repo `if:`; the fork step runs for any fork PR with the bypass armed.
name: Review
on:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout same-repo PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
      - name: Checkout fork PR
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Same-repo review
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Review PR ${{ github.event.pull_request.number }}
      - name: Fork review
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: '*'
          prompt: |
            Review PR ${{ github.event.pull_request.number }}
            Title: ${{ github.event.pull_request.title }}

# A gated review that checks out the base and reads only the diff.
name: Review
on:
  pull_request_target:
    types: [labeled]
jobs:
  review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Bash(gh pr diff:*),Read"

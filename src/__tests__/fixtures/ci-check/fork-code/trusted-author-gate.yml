# Only PRs written by a listed maintainer: the head is a trusted author's code.
name: Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  review:
    if: github.event.pull_request.user.login == 'maintainer-a' || github.event.pull_request.user.login == 'maintainer-b'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /code-review

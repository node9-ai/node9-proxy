# A labelled review with Codex in a read-only sandbox over the PR merge ref: none of the
# fork's code runs.
name: Review
on:
  pull_request_target:
    types: [labeled]
jobs:
  review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: /code-review

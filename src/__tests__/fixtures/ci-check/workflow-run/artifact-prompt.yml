# A workflow_run handler downloads the triggering run's artifacts (produced by a fork PR's own
# workflow) and builds the agent's prompt from them in an earlier step.
name: CI failure comment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  explain:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ci-failure-*
      - id: prompt
        run: |
          {
            echo 'value<<EOF'
            cat ci-failure-*/failure.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: someone/claude-code-action@0123456789abcdef0123456789abcdef01234567
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash Read Grep"
          prompt: ${{ steps.prompt.outputs.value }}

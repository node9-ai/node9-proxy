# Dependency updates, grouped so they arrive as a few reviewable PRs a week
# rather than one per package. Security advisories still open their own PR.
#
# Commit types follow .releaserc.json: a runtime dependency bump is fix(deps),
# so merging it releases a patch and the new version reaches users. Dev
# dependency and GitHub Actions bumps never change the published package, so
# they are chore(deps-dev) and ci(deps), which release nothing.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: npm
    directory: /packages/policy-engine
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
